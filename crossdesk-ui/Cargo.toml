[package]
name = "crossdesk-ui"
description = "CrossDesk desktop frontend"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dependencies]
async-channel = "2.5.0"
eframe = { version = "0.35.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
] }
futures = "0.3.30"
hostname = "0.4.0"
iconflow = { version = "1.0.0", features = ["pack-lucide"] }
lan-mouse-ipc = { path = "../lan-mouse-ipc", version = "0.4.0" }
log = "0.4.22"
thiserror = "2.0.0"
tokio = { version = "1.51.0", features = ["rt", "sync", "time"] }
tray-icon = { version = "0.24.1", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.35.0", features = ["eframe"] }
serde_json = "1.0.149"
