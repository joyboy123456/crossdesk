[package]
name = "crossdesk-ui"
description = "CrossDesk desktop frontend"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
async-channel = "2.5.0"
eframe = { version = "0.35.0", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
    "persistence",
] }
futures = { workspace = true }
hostname = "0.4.0"
iconflow = { version = "1.0.0", features = ["pack-lucide"] }
lan-mouse-ipc = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tray-icon = { version = "0.24.1", default-features = false }

[dev-dependencies]
egui_kittest = { version = "0.35.0", features = ["eframe"] }
serde_json = { workspace = true }
