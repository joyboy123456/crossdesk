[workspace]
members = [
    "crossdesk-ui",
    "input-capture",
    "input-emulation",
    "input-event",
    "lan-mouse-ipc",
    "lan-mouse-cli",
    "lan-mouse-proto",
]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/feschber/lan-mouse"

[workspace.dependencies]
# internal crates
crossdesk-ui = { path = "crossdesk-ui", version = "0.1.0" }
input-capture = { path = "input-capture", version = "0.4.0", default-features = false }
input-emulation = { path = "input-emulation", version = "0.4.0", default-features = false }
input-event = { path = "input-event", version = "0.4.0" }
lan-mouse-cli = { path = "lan-mouse-cli", version = "0.4.0" }
lan-mouse-ipc = { path = "lan-mouse-ipc", version = "0.4.0" }
lan-mouse-proto = { path = "lan-mouse-proto", version = "0.4.0" }
# third-party (shared by two or more crates)
async-trait = "0.1.81"
bitflags = "2.6.0"
clap = { version = "4.4.11", features = ["derive"] }
futures = "0.3.30"
futures-core = "0.3.30"
log = "0.4.22"
num_enum = "0.7.2"
once_cell = "1.19.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.107"
thiserror = "2.0.0"
tokio = "1.51.0"
tokio-util = "0.7.11"
# platform backends (shared by input-capture / input-emulation)
ashpd = { version = "0.13.9", default-features = false }
core-foundation = "0.10.0"
core-foundation-sys = "0.8.6"
core-graphics = { version = "0.25.0", features = ["highsierra"] }
keycode = "1.0.0"
libc = "0.2.155"
reis = "0.7.0"
wayland-client = "0.31.1"
wayland-protocols = "0.32.1"
wayland-protocols-misc = "0.3.1"
wayland-protocols-wlr = "0.3.1"
windows = "0.61.2"
x11 = { version = "2.21.0", features = ["xlib", "xtest"] }

[package]
name = "lan-mouse"
description = "Software KVM Switch / mouse & keyboard sharing software for Local Area Networks"
version = "0.11.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "crossdesk"

[[bin]]
name = "crossdesk"
path = "src/bin/crossdesk.rs"
required-features = ["gui"]

[profile.release]
codegen-units = 1
lto = "fat"
strip = true
panic = "abort"

[build-dependencies]
shadow-rs = "1.2.0"

[dependencies]
arboard = { version = "3.6.1", default-features = false }
input-event = { workspace = true }
input-emulation = { workspace = true }
input-capture = { workspace = true }
lan-mouse-cli = { workspace = true }
crossdesk-ui = { workspace = true, optional = true }
lan-mouse-ipc = { workspace = true }
lan-mouse-proto = { workspace = true }
shadow-rs = { version = "1.2.0", features = ["metadata"] }

toml = "0.8"
toml_edit = { version = "0.22", features = ["serde"] }
serde = { workspace = true }
log = { workspace = true }
env_logger = "0.11.3"
serde_json = { workspace = true }
tokio = { workspace = true, features = [
    "io-util",
    "io-std",
    "macros",
    "net",
    "process",
    "rt",
    "sync",
    "signal",
] }
futures = { workspace = true }
clap = { workspace = true }
slab = "0.4.9"
thiserror = { workspace = true }
tokio-util = { workspace = true }
local-channel = "0.1.5"
webrtc-dtls = { version = "0.12.0", features = ["pem"] }
webrtc-util = "0.11.0"
rustls = { version = "0.23.12", default-features = false, features = [
    "std",
    "ring",
] }
rcgen = "0.13.1"
sha2 = "0.10.8"
notify = "8.2.0"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[features]
default = [
    "gui",
    "layer_shell_capture",
    "x11_capture",
    "libei_capture",
    "wlroots_emulation",
    "libei_emulation",
    "rdp_emulation",
    "x11_emulation",
]
metrics = ["input-capture/metrics"]
gui = ["dep:crossdesk-ui"]
layer_shell_capture = ["input-capture/layer_shell"]
x11_capture = ["input-capture/x11"]
libei_capture = ["input-event/libei", "input-capture/libei"]
libei_emulation = ["input-event/libei", "input-emulation/libei"]
wlroots_emulation = ["input-emulation/wlroots"]
x11_emulation = ["input-emulation/x11"]
rdp_emulation = ["input-emulation/remote_desktop_portal"]

[package.metadata.bundle]
name = "CrossDesk"
icon = ["target/icon.icns", "resources/de.feschber.LanMouse.svg"]
identifier = "app.crossdesk.CrossDesk"
osx_info_plist_exts = ["build-aux/macos-lsui-element.plist"]
resources = ["target/menubar-template.png"]
